name: minibank

services:
  db:
    image: postgres:14
    environment:
      POSTGRES_DB: minibank
      POSTGRES_USER: minibank
      POSTGRES_PASSWORD: minibank
    ports:
      # 55432 rather than 5432, because 5432 is usually already taken by a PostgreSQL
      # installed on the machine, and publishing onto an occupied port either fails or,
      # worse, leaves the reader talking to the wrong server. This is the port every
      # command in the README names, so a clone with no .env connects.
      # Override it when 55432 is taken too:
      #   MINIBANK_DB_PORT=55433 docker compose up -d
      - "${MINIBANK_DB_PORT:-55432}:5432"
    volumes:
      # A directory, not a single file: on Windows, Docker Desktop creates a directory in
      # place of a missing bind mount source, and the container is then broken for good.
      # db/init holds exactly what may run unattended; db/reset.sql stays out of it.
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - minibank_pgdata:/var/lib/postgresql/data
    healthcheck:
      # Over TCP on purpose. initdb runs a temporary server that listens on the unix socket
      # only, so a socket check reports ready while initialisation is still running.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U minibank -d minibank"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  minibank_pgdata:
