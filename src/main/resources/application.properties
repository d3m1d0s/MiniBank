# The demo profile seeds a sample customer and creates the demo logins on
# startup. It is the default so the project runs straight after a clone;
# activating any other profile switches it off, and then the API serves only
# whatever data already exists.
#
#   java -jar target/VIS_project_minibank-1.0-SNAPSHOT.jar
#       -> demo profile, sample data and demo logins are created
#
#   java -jar target/VIS_project_minibank-1.0-SNAPSHOT.jar --spring.profiles.active=plain
#       -> no seeding, no demo logins
#
# The demo credentials and the fixed one time password are throwaway local
# values, not secrets. See the README.
spring.profiles.default=demo

# Configuration keys, all optional. The REST API resolves them through this file,
# the command line or the environment; the console entry points read the same
# names as system properties, so one -D works everywhere. The names and the
# defaults are declared in cz.vsb.minibank.application.MinibankProperties and are
# deliberately not repeated here, so there is nothing to keep in sync.
#
#   minibank.storage        json or sql
#   minibank.json.path      JSON store used by the console app and by json mode
#   minibank.sql.url        JDBC url, used by sql mode and by the SQL tests
#   minibank.sql.user
#   minibank.sql.password
#   minibank.demo.path      the demo runner's own store, kept apart from the above
#   minibank.demo.reset     true discards that store before the demo runs
#   minibank.log.file       destination of the application log

# A request that never reaches a mapped handler - an unknown URL, for instance - is
# answered by Spring Boot's own error controller rather than by RestExceptionHandler, so
# its body carries no "code" field. These two are Boot's defaults today; they are pinned
# here so that a Boot upgrade or a stray property cannot start putting exception text and
# stack traces on the wire on exactly the paths our advice does not cover.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# LoginThrottle keys on HttpServletRequest.getRemoteAddr(), and that is only safe while it is
# the peer of the connection rather than something the caller writes. Left unset, Boot does not
# default this to NONE: ServletWebServerFactoryCustomizer falls back to the active cloud
# platform's preference, which turns forwarded headers on by itself on some of them. Pinned
# here for the same reason as the four lines above - a Boot upgrade or a stray property must
# not change behaviour on a path the code assumes.
#
# Turning this on makes X-Forwarded-For the key. Every guess could then arrive with a fresh
# counter and the throttle would bound nothing, and the map would again be keyed on attacker
# input. If this application is ever put behind a reverse proxy, configure a trusted proxy
# list first, or move the throttle to the proxy.
server.forward-headers-strategy=none
