<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Without this line a browser asks for /favicon.ico on every load and is answered with the
      only 404 either application produces. An SVG and no .ico fallback: every browser these
      screens are built for takes one, and a second file would be a second mark to keep in step.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>MiniBank</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
